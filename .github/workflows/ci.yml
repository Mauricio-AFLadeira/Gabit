name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mirrors what `make lint`/`make build`/`make test` already run in the
# dockerized toolchain — the pinned Swift version here matches
# .swift-version / SWIFT_VERSION so CI and local dev see the same compiler.
jobs:
  lint-and-test:
    name: Lint, build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.3.3-noble

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mauit
          POSTGRES_PASSWORD: mauit
          POSTGRES_DB: mauit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mauit -d mauit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: mauit
      DATABASE_PASSWORD: mauit
      DATABASE_NAME: mauit_test
      DATABASE_TEST_NAME: mauit_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift-format lint
        run: |
          swift format lint --strict --recursive Sources App Tests
          swift format lint --strict Package.swift

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  ios-build:
    name: Build iOS app (Xcode)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # XcodeGen's project format can outrun whichever Xcode the runner
      # image ships as its *default* — pin the newest Xcode actually
      # installed on the runner rather than whatever `xcode-select` points
      # at out of the box, so `xcodegen generate` and `xcodebuild` agree.
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build MauIt for the Simulator
        run: |
          xcodebuild build \
            -project MauIt.xcodeproj \
            -scheme MauIt \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
