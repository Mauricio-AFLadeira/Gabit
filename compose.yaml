name: mauit

services:
  app:
    build:
      context: .
      target: dev
      args:
        SWIFT_VERSION: ${SWIFT_VERSION:-6.3.3}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        WITH_SWIFTLINT: ${WITH_SWIFTLINT:-0}
        SWIFTLINT_VERSION: ${SWIFTLINT_VERSION:-0.65.1}
    image: mauit-dev:${SWIFT_VERSION:-6.3.3}
    init: true
    working_dir: /workspace
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-mauit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mauit}
      DATABASE_NAME: ${DATABASE_NAME:-mauit}
      DATABASE_TEST_NAME: ${DATABASE_TEST_NAME:-mauit_test}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-change-me}
    ports:
      - "8080:8080"
    volumes:
      # The repository itself, so edits on the host are visible instantly —
      # there is nothing to rebuild between `make lint` runs.
      - .:/workspace
      # Kept off the bind mount on purpose: Xcode writes Mach-O objects into
      # .build on macOS and the container writes ELF ones. Sharing the directory
      # makes the two toolchains fight over the same artifacts.
      - build:/workspace/.build
      - spm-cache:/home/mauit/.cache/org.swift.swiftpm
    healthcheck:
      test: ["CMD-SHELL", "swift --version > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

  # Postgres for the Server target (Fluent). `make migrate` / `make serve`
  # run inside the `app` container and reach this over the compose network.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-mauit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mauit}
      POSTGRES_DB: ${DATABASE_NAME:-mauit}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once against a fresh volume: creates the `mauit_test` database
      # ServerTests uses, kept separate from the `mauit` one so `make test`
      # never touches data you're poking at manually.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-mauit} -d ${DATABASE_NAME:-mauit}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  build:
  spm-cache:
  pgdata:
