# Source of truth for the Xcode project. `make xcode` turns this into
# MauIt.xcodeproj, which is generated and therefore not committed — the file
# you edit is this one.

name: MauIt

options:
  bundleIdPrefix: com.mauricioafl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MauItKit:
    path: .

targets:
  MauIt:
    type: application
    platform: iOS
    sources:
      - path: App/MauIt
    dependencies:
      - package: MauItKit
        product: MauItKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauricioafl.MauIt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MauIt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
